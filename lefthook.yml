# yaml-language-server: $schema=https://json.schemastore.org/lefthook.json
pre-commit:
  parallel: true
  jobs:
    - name: secrets
      run: betterleaks git --pre-commit --staged --redact --verbose
    - name: no-dashes
      run: |
        ! grep -nIE "$(printf '\342\200\223|\342\200\224')" {staged_files}
      fail_text: "En or em dash found. AGENTS.md bans them: rewrite the sentence."
    - name: whitespace
      run: git diff --cached --check
    - name: changelog-unreleased
      glob: "CHANGELOG.md"
      run: sh scripts/check-changelog-unreleased.sh --staged

commit-msg:
  jobs:
    - name: conventional
      # lefthook pastes {1} into the script unquoted, so a quoted heredoc keeps every byte of the message path literal,
      # newlines included. Only a path line reading exactly MESSAGE_PATH could end it early. The loop joins the lines
      # back instead of capturing them with $(...), which macOS sh cannot parse around a lone apostrophe.
      run: |
        nl='
        '
        message=
        while IFS= read -r line; do message=${message:+$message$nl}$line; done <<'MESSAGE_PATH'
        {1}
        MESSAGE_PATH
        head -1 "$message" | grep -qE '^(feat|fix|docs|chore|ci|refactor)(\(.+\))?!?: .+' || { echo "Use Conventional Commits: type(scope): description. Accepted types: feat, fix, docs, chore, ci, refactor."; exit 1; }

pre-push:
  parallel: true
  jobs:
    - name: tests
      glob: "{scripts,tests,skills}/*"
      # A hook in a linked worktree exports an absolute GIT_DIR, which would aim every fixture repo in the tests at the real repo.
      run: env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE -u GIT_COMMON_DIR sh -c 'for t in tests/*.test.sh; do sh "$t" || exit 1; done && bun test tests/'
    - name: plugin-validate
      run: claude plugin validate --strict . && claude plugin validate --strict ./skills
