name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: curl -fsSL https://claude.ai/install.sh | bash
      - run: ~/.local/bin/claude plugin validate --strict .
      - run: ~/.local/bin/claude plugin validate --strict ./skills

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: |
          for t in tests/*.test.sh; do
            sh "$t" || exit 1
          done
      - run: node --test tests/*.test.mjs

  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            sh scripts/check-changelog-unreleased.sh "$PR_BASE" "$PR_HEAD"
          else
            if [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "::notice::There is no previous commit to compare; the PR run is the gate."
              exit 0
            fi
            sh scripts/check-changelog-unreleased.sh "$PUSH_BEFORE" "$PUSH_AFTER"
          fi

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          BETTERLEAKS_VERSION: 1.9.0
          BETTERLEAKS_SHA256: f8b185a39ffcece2a1ca82bf3a4e7435cd81963ffd16b7a9128daf75f35f6de7
        run: |
          archive="$RUNNER_TEMP/betterleaks.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$BETTERLEAKS_SHA256  $archive" | sha256sum -c -
          mkdir "$RUNNER_TEMP/betterleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/betterleaks" betterleaks
          echo "$RUNNER_TEMP/betterleaks" >> "$GITHUB_PATH"
      - env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            base=$PR_BASE head=$PR_HEAD
          else
            if [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "::notice::There is no previous commit to compare; the PR run is the gate."
              exit 0
            fi
            base=$PUSH_BEFORE head=$PUSH_AFTER
          fi
          # Run both checks so one run reports every offence.
          status=0
          sh scripts/check-dashes-whitespace.sh "$base" "$head" || status=1
          # The scanner can relay source-bearing Git warnings despite --redact.
          errors=$(mktemp)
          trap 'rm -f "$errors"' EXIT
          betterleaks git --no-banner --redact --verbose --log-opts="$base..$head" . 2> "$errors" || status=1
          if [ -s "$errors" ]; then
            echo 'Secrets scan emitted diagnostics; source-bearing details omitted.' >&2
          fi
          exit "$status"

  skills:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: supermatt
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: svyatov/oss-kit
          ref: f19ee20590d7de1e441f1ba46af097d15d52f0d9
          path: oss-kit
          persist-credentials: false
      - run: node oss-kit/skills/oss-skill/scripts/validate.mjs supermatt

  skillspector:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: svyatov/setup-skillspector@451614c57972f6053b0bd07f73503aeaf9addbe5 # v1.0.0
